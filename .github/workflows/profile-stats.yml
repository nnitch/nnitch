name: Update README stats cards

on:
  # Hourly (off the :00 mark, since GitHub delays jobs queued on the hour)
  schedule:
    - cron: "17 * * * *"
  # Any push to this repo, except the bot's own SVG commits
  push:
    branches: [main]
    paths-ignore:
      - "profile/**"
  # Lets your other repos (public or private) ping this one on push
  repository_dispatch:
    types: [refresh-stats]
  # Manual "Run workflow" button
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&count_private=true&include_all_commits=true"
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8"
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update README stats cards"
          git push
